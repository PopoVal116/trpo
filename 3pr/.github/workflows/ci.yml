name: CI - GEMM Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libopenblas-dev \
          libomp-dev \
          gcc \
          g++

    - name: Build and run correctness tests
      run: |
        gcc -o test_correct \
          tests/test_correct.c \
          src/gemm.c \
          -Iinclude \
          -Itests \
          -lopenblas \
          -fopenmp \
          -lm -O2
        
        ./test_correct

    - name: Build and run performance tests
      run: |
        gcc -o perf_test \
          tests/perf_test.c \
          src/gemm.c \
          -Iinclude \
          -Itests \
          -lopenblas \
          -fopenmp \
          -lm -O2
        
        ./perf_test